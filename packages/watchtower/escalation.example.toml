# The escalation executor.
#
# Run this as a SEPARATE process from the daemon, under a SEPARATE supervisor unit. If they
# share a unit, a crash loop in one restarts the other and "separate failure domains"
# becomes a comment rather than a property.
#
#   navcom-escalation /etc/navcom/escalation.toml

[identity]
# The same Watchtower key the daemon uses -- the executor must hear and answer for the watch itself
# rather than being handed events by a process that might be hung. Two processes therefore hold the
# key. That cost is real and accepted: the alternative is an escalation path that depends on the
# availability of the component most likely to hang.
#
# The daemon makes it on its first start; the executor NEVER does. Run as a user of its own, the
# executor needs a copy it can read (ops/systemd/README.md, 4b). Missing or unreadable, the executor
# does not start and says why: a key made here would be a watch no phone knows, and an executor that
# hears no Distress meant for this watch looks healthy. --check prints this key and says whether any
# relay holds a watch state signed by it.
privkey_path = "/var/lib/navcom/watchtower.key"

# The executor's OWN key, which nothing else on this box may read.
#
# The daemon holds the watch key, and the agent runs beside the daemon. Without a key of its own,
# every answer that ends a Distress -- "Wren is responding." -- is signed with the watch key, so a
# phone cannot tell a person's answer from one the agent made up. With one, every response is signed
# with it (and copied under the watch key for phones handed the watch before), and a phone handed
# this key ends a Distress only on an answer it signed.
#
# An absolute path. The executor makes it on its first start, as the user it runs as, mode 0600 --
# but only where daemon_user (below) names a user of this machine that is neither root nor the user the
# executor runs as; otherwise it makes none, says why, and runs without one. --check and --drill never
# make it. Once the key passes its check, the executor prints a watch code -- a link signed by the watch
# key that carries this key -- at every start and in --check: hand operators that, scanned or pasted,
# never the key typed. Run the executor as a user of its own -- NOT the daemon's
# (ops/systemd/navcom-escalation.service). A backup of this file is the key; keep it as one. If it is
# ever lost, the new one made in its place is said at every start, and --check fails, until you restore
# the old key or hand out the new code and remove the record it names.
#
# Leave it out and the box runs exactly as it did before the key existed, and says so at every start
# and in --check.
# executor_key_path = "/var/lib/navcom-escalation/executor.key"

# The user the daemon runs as, by name or uid -- not root. Startup warns about, and --check refuses, an
# executor key that user owns or that other users can read, an executor running as that user, and a
# daemon running as root, which can read every file. Where executor_key_path is set, --check fails while
# this is unset, and the executor makes no key: without it, nothing can confirm the daemon -- and the
# agent beside it -- cannot read the executor's key.
# daemon_user = "navcom"

[relays]
# Its own subscription. This is what makes the separation structural.
urls = ["wss://relay.damus.io", "wss://nos.lol"]

[log]
# Where THIS process records what actually happened to each Distress -- paged, acknowledged
# by whom, or exhausted. Its own file and its own chain, deliberately separate from the
# daemon's accountability log: the daemon does not run the ladder and does not know the
# outcome, so it cannot record one truthfully. Two processes appending to one chain is a
# correctness problem of its own; a second file sidesteps it.
#
# Not yet surfaced through the daemon's log-review response -- an operator reviewing their
# record today sees the daemon's log only. Merging the two is real, separate, future work.
path = "/var/lib/navcom/escalation-log.jsonl"
retention_days = 90

[escalation]
# How long to wait for an on-call human before moving on. Configurable; the spec's default
# is 300. Shortening it does not make help arrive sooner -- it only reaches "nobody is
# coming" sooner, which is sometimes the more useful truth.
#
# It is also how often the person who acknowledged a Distress may be paged again about that
# operator, and at all (ack_holds_seconds, below) -- but never more often than once in 300 seconds,
# so shortening it does not page them more often. A phone resends every 20 to 80 seconds; a window
# shorter than that paged them on every attempt.
#
# It is not how far off a phone's clock may be. A Distress stamped up to this many seconds
# from this machine's clock is heard, but never fewer than 300: a phone reads this watch as up
# until its state is 300s old, so it has to be heard that far off. The executor says so at
# startup when this is shorter.
paging_window_seconds = 300
contact_window_seconds = 300

# How many times this watch is willing to wake somebody, and how often.
#
# The watch's address is meant to be handed out, so anybody holding it can publish a signed
# 20911 from a key they made a second ago. Unbounded, three hundred of those page a real
# person three hundred times -- which is how escalation dies. Not by being wrong: by being
# ignored on the night it is right.
#
# Past the budget the ladder still opens and the operator is still told, and what they are
# told is the truth -- that nobody could be paged. The ladder is allowed to fail. It is never
# allowed to fail silently.
#
# Twenty an hour is deliberately generous. A squad having twenty separate emergencies in an
# hour has a situation this number is not relevant to; a flood passes it in under a second.
# If you raise it, raise it because your squad is large, not because it looks low.
#
# It counts FIRST pages only: one for each ladder that pages. Pages to the person who acknowledged a
# Distress, about an operator still sending inside ack_holds_seconds, take nothing from it and are
# never refused by it -- only a first page is open to a stranger, and charged to one pool a few
# operators sending through a hold spent what a new Distress needed. Those pages have a limit of
# their own, per person (ack_holds_seconds, below).
max_pages_per_window = 20
page_budget_window_seconds = 3600

# How long a finished ladder is kept before it is dropped. Long enough that a late duplicate
# of the same 20911 finds it rather than starting a second ladder. Live ladders are never
# dropped at any age.
ladder_retention_seconds = 3600

# How long a human's acknowledgement answers that operator's later Distress attempts.
#
# A phone that missed the acknowledgement -- its connection dropped at that moment -- keeps
# sending, and each new attempt used to open a fresh ladder and page the roster again for an
# emergency somebody was already answering. Inside this window a new attempt from that operator
# gets the same acknowledgement back, from the same human, and the person who acknowledged is
# paged about it -- only them, on their own entries below, and nobody else, with a page that opens
# "NavCom REPEAT". A phone resends every 20 to 80 seconds, so: the first page about each operator
# they hold goes at once; after that, at most once per paging_window_seconds (never more often than
# once in 300 seconds) for that operator, and at most once per that interval for the person, in one
# page naming every operator they hold who sent since. None of it comes from the page budget. A
# ceiling of 24 an hour per person is there only to catch a loop. Recorded in the log as `acked`,
# and the page as `contacted`.
#
# The person paged can ask the watch to wake the others about that attempt ({{attempt}}, below), from
# the screen the repeat page opens: the hold ends and a ladder for it pages everyone else on call --
# for every operator that page named. Where nobody else can be paged, or the page budget is spent, it
# changes nothing: the hold stands and they are still the one paged. It never tells the operator a
# person has them; only acknowledging that ladder does.
#
# The cost: a genuinely new emergency from the same operator inside the window is read as the
# old one until it closes by everybody except the person who acknowledged -- the rest of the
# roster is not woken unless they ask. A keyless pager still pages, because it cannot see the
# acknowledgement.
#
# If the person who acknowledged cannot be paged again -- no longer on call, console-open only, at
# their ceiling, or every channel of theirs failing -- the hold ends and that attempt opens a ladder
# for the whole roster (at the ceiling, them included), as a new Distress would, and the operator is told why and what that ladder
# could do. A ladder still running for that operator comes first: a new attempt joins it rather
# than being answered from the hold. An EXHAUSTED ladder holds nothing -- nobody answered that one,
# so a new attempt pages as before.
ack_holds_seconds = 1800

# Drills. Unannounced, randomised inside the window, and published -- a watch that cannot
# demonstrate a passing drill is presumed broken, and 10910 carries the last result so a
# client sees it before signing on.
#
# A pass requires a HUMAN acknowledgement. A command exiting zero says a message left a
# machine; somebody whose phone buzzed is not somebody who woke up. An empty roster is a
# FAIL rather than a skip, because "nobody is on-call" is exactly what a weekly drill is
# for.
drill_window_days = 7
drill_ack_window_seconds = 600
drill_state_path = "/var/lib/navcom/drill.json"

# Where this executor writes where it hears: each relay in [relays], and whether its own
# subscription there is answered -- every 30 seconds and on any change, 0640 like the drill file.
#
# The daemon reads it, from the same path in watchtower.toml ([log] hearing_state_path), and
# publishes the watch state only on relays where BOTH processes hear. A relay that refuses this
# executor's subscription -- one that wants NIP-42 AUTH, say -- then reads Dark to operators, which is
# the truth, rather than showing a live watch while a Distress sent only there pages nobody. A file
# that is missing, or more than 90 seconds old, means this executor hears nowhere and the watch reads
# Dark: a box whose executor is down reads Dark, though its agent would still answer a Query.
#
# A write that fails is said once and never stops the ladder. Stopping, the executor writes that it
# hears nowhere. --drill never writes it. It must not be the drill file, or any other file here.
#
# Its directory must belong to the user this executor runs as, and nobody else may write it: in a
# directory the daemon's user can write, the daemon -- or the agent beside it -- could leave a link
# where the file goes and have the executor overwrite its own key. So it writes nothing there and
# says why. The path below suits an executor running as the daemon's user. Running as a user of its
# own, put this file and drill_state_path in the drill directory, which that user owns and the
# daemon's user can only read (ops/systemd/README.md, 4b).
hearing_state_path = "/var/lib/navcom/hearing.json"

# Don't wait a week to find out whether your roster works:
#
#     navcom-escalation --drill escalation.toml
#
# Same code path a scheduled drill takes. Exits non-zero when nobody answers.
#
#     navcom-escalation --check escalation.toml
#
# also asks each relay for the subscription this executor makes, names each that refuses it, leaves
# it unanswered or cannot be reached, and exits non-zero when none answers.

# Everyone here is paged AT ONCE. In an emergency you want everyone, and walking a roster in
# order spends the only resource that matters.
#
# Registering a channel is a CONDITION of the on-call role -- an entry with no way to wake
# anyone is refused at startup rather than paged into nothing.
#
# `command` is argv, never a shell string, so nothing in a distress payload can become a
# command. Substituted per argument:
#
#   {{message}}   the words: "NavCom DISTRESS ...", "NavCom REPEAT ...", or "[NAVCOM TEST ..."
#   {{callsign}}  this entry's callsign
#   {{kind}}      first (a ladder's page), repeat (paged again about an operator you acknowledged),
#                 or drill (a drill, or --check's test)
#   {{distress}}  a first page's Distress id, for a one-tap acknowledgement; empty otherwise
#   {{attempt}}   a repeat page's attempt id, for "wake the others"; empty otherwise
#
# `pubkey` is the key this person ACKNOWLEDGES with, and it is a different thing from the
# channel they are woken on. An ack is matched by key: without one here, this person cannot
# stop a ladder from their own device.
#
# That is legitimate for somebody on-call by phone who does not run NavCom -- they
# acknowledge by telling whoever is at the console. But if NO on-call entry has a pubkey,
# nothing can ever acknowledge: every ladder runs to EXHAUSTED even when help is on the way,
# and every drill FAILS, which demotes this watch permanently. The executor says so at
# startup.
#
# Never the watch key, and never the executor's: neither is a person's. The daemon and the agent
# beside it hold the watch key, so an acknowledgement or a wake signed with it is refused whatever
# this list says. Startup says so of such an entry, and --check fails on it.
#
# [[escalation.oncall]]
# callsign = "Wren"
# pubkey   = "npub-as-64-hex-characters"
# channel  = "sms"
# command  = ["signal-cli", "-a", "+15550000", "send", "-m", "{{message}}", "+15550100"]
#
# [[escalation.oncall]]
# callsign = "Raven"
# channel  = "push"
# command  = ["curl", "-fsS", "-d", "{{message}}", "https://ntfy.sh/your-private-topic"]
#
# Web Push to the Field Terminal, with everything a phone needs to tell a first page from a repeat
# and a drill. A navcom-push entry without --kind still pages, but every page reaches that phone
# looking like a new Distress; the executor names such entries at startup and in --check.
#
# [[escalation.oncall]]
# callsign = "Kestrel"
# pubkey   = "npub-as-64-hex-characters"
# channel  = "push"
# command  = ["navcom-push", "--to", "/etc/navcom/oncall/kestrel.json",
#             "--kind", "{{kind}}", "--distress", "{{distress}}", "--attempt", "{{attempt}}"]

# With no entries at all, a Distress pages nobody, reaches EXHAUSTED immediately, and the
# operator is told so. That is the ladder working correctly. It is not the ladder helping.
#
# ---------------------------------------------------------------------------
# Getting one person on-call, which is the whole game
# ---------------------------------------------------------------------------
#
# Everything the ladder does is theatre until one entry above works. Prove it:
#
#     navcom-escalation --check escalation.toml
#
# It pages the whole roster with a message that opens
# "[NAVCOM TEST -- NOT AN EMERGENCY]", reports which commands exited zero, and exits
# non-zero if any failed or if the roster is empty.
#
# A command exiting zero is NOT a person waking up. Go and confirm the message arrived on
# the device it was meant for. That second half is the part that cannot be automated, and
# it is the part that matters.
#
# Some commands that need no account and no provider integration:
#
#   # Push, via a private ntfy topic. Third party -- disclose it to whoever is on-call,
#   # because their paging metadata passes through someone else's server.
#   command = ["curl", "-fsS", "-d", "{{message}}", "https://ntfy.sh/pick-something-unguessable"]
#
#   # A local desktop notification. Only wakes somebody sitting at the box, so it is
#   # closer to console-open than to a real channel -- useful for testing the wiring.
#   command = ["osascript", "-e", "display notification \"{{message}}\" with title \"NavCom\""]
#
#   # Anything you already run. A script, a bot, a gateway you control. Preferred, because
#   # it puts no third party in the one path that must not depend on anybody else's uptime.
#   command = ["/usr/local/bin/page-me", "{{message}}"]
