# NavCom Watchtower daemon config. Copy to watchtower.toml (gitignored)
# and adjust for your environment.
#
# "Every timing value must be changeable without a code change" -- every
# field here is read at startup; nothing in [watch] is hardcoded in src/.

[identity]
# Where the Watchtower's own secp256k1 secret key lives. Generated here
# on first run if it doesn't exist yet. Never transmitted, never escrowed.
privkey_path = "./watchtower.key"

[relays]
# Any public Nostr relay(s) the daemon connects OUTWARD to as a client.
# The daemon is not a relay itself -- nothing here needs to be hosted.
urls = ["wss://relay.damus.io", "wss://nos.lol"]

[watch]
routine_interval_default = 3600
overdue_grace            = 1800
hard_expiry              = 14400

# Not in the original brief's sample block -- see config.ts's docstring
# for why these exist (kind 10910 is a replaceable event, so a relay
# would keep serving a dead daemon's last copy forever without a
# heartbeat + staleness check on the client side).
heartbeat_interval_seconds = 60
sweep_interval_seconds     = 15

# How long a "query" signal's answerQuery() call is allowed to take
# before the operator gets a timeout error-ack instead of an indefinite
# wait. Session one's hardcoded answer returns instantly, so this
# doesn't matter yet -- it starts mattering the moment answerQuery()
# becomes a real network call to a Mecha Jono bridge.
query_timeout_seconds = 8

# How far from now a signal or Distress may be stamped, either way, and still be acted on.
# A signed event is valid for ever and any relay can serve one again, so without this a relay
# replaying a captured Distress makes the watch act on it again. The executor holds the same
# rule. A phone whose clock is further off than this is not heard, and the daemon logs each one
# it drops.
#
# At least 300, refused below that at startup: a phone reads this watch as up until its state
# is 300s old by the phone's own clock, so a narrower window ignores phones that believe they
# are heard -- and their sign-on, Query and Distress all get silence.
max_event_age_seconds = 300

[authorization]
# Stage 2. Leave this section out entirely (or allowed_pubkeys = [])
# during an early closed pilot -- that's Session One's original "any
# pubkey" policy, unchanged. Once you're ready to restrict who may sign
# on, list their Watchtower CLI pubkeys here (lowercase 64-char hex --
# the same value `watchtower-cli status` and the on-station/etc commands
# already use). Everyone NOT listed is silently dropped, not told no.
# allowed_pubkeys = ["<lowercase 64-char hex pubkey>", "<another one>"]
allowed_pubkeys = []

[log]
# The accountability log -- the opposite of the board in every way. The board is Live, in
# memory, and expires; this is append-only, on disk, and retained. It records actions,
# never positions, areas or query text.
#
# It is what makes the watch answerable to the operators it concerns [C33], so it is not
# inside either device wipe tier and it is not the watch's to delete.
path = "/var/lib/navcom/accountability.jsonl"

# Entries older than this are dropped on start. Rotation records the dropped tail's final
# hash so the chain still verifies afterwards rather than looking tampered with.
retention_days = 90

# Where the escalation executor writes where it hears: the same path as its [escalation]
# hearing_state_path. Read, never written, by this daemon.
#
# With it, the watch state is published only on relays where this daemon AND the executor both
# hear, so a relay that refuses the executor's subscription reads Dark rather than showing a live
# watch while a Distress sent only there pages nobody. A file that is missing, unreadable, about
# another watch key, or more than 90 seconds old means the executor hears nowhere: the watch state
# goes nowhere, and this daemon's log says why. A box whose executor is down therefore reads Dark,
# though its agent would still answer a Query.
#
# Leave it out and the daemon publishes wherever it hears itself, as it did before, says at every
# start what that costs, and `watchtower-daemon --check` fails until it is set. On a box already
# running, set it once the executor has written the file (ls -l it), or the watch reads Dark until it
# does.
hearing_state_path = "/var/lib/navcom/hearing.json"

# ---------------------------------------------------------------------------
# The escalation executor reads its own config file, not this one.
# See escalation.example.toml. That separation is deliberate: the executor must
# not depend on the daemon for anything, including configuration.
# ---------------------------------------------------------------------------
